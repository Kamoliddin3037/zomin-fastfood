services:
  - type: web
    name: zomin-fastfood
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DIR
        value: ./data
      - key: DB_PATH
        value: ./data/fastfood.sqlite
