<!DOCTYPE html>
<html lang="uz" data-theme="dark" data-color-scheme="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kuryer Portali | Zomin FastFood Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/service.css">
  <link rel="stylesheet" href="css/depth.css">

  <style>
    body {
      background: #0B0F17;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
    }

    .courier-header {
      background: rgba(18, 26, 38, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .courier-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .courier-brand .logo-icon {
      width: 42px;
      height: 42px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--primary, #10b981);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--primary, #10b981);
    }

    .courier-brand h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 800;
    }

    .courier-brand span {
      font-size: 11px;
      color: var(--primary, #10b981);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .courier-brand span .dot {
      width: 6px;
      height: 6px;
      background: var(--primary, #10b981);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary, #10b981);
    }

    .courier-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-sound {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .courier-container {
      max-width: min(96%, 1360px);
      margin: 0 auto;
      padding: clamp(14px, 3vw, 24px);
    }

    .status-filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .tab-pill {
      flex: 1;
      min-width: 130px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab-pill.active {
      background: var(--primary, #10b981);
      color: #fff;
      border-color: var(--primary, #10b981);
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
    }

    .tab-count {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 7px;
      border-radius: 8px;
      font-size: 11px;
    }

    .courier-orders-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 680px) and (max-width: 1100px) {
      .courier-orders-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1101px) {
      .courier-orders-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
    }

    .delivery-card {
      background: rgba(18, 26, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.25s ease;
    }

    .delivery-card.delivering {
      border-color: #3b82f6;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }

    .delivery-card.ready {
      border-color: #f59e0b;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-id-badge {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .status-badge.ready {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .status-badge.delivering {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .customer-info-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.9);
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-row i {
      color: var(--primary, #10b981);
      width: 16px;
      margin-top: 3px;
    }

    .action-links-row {
      display: flex;
      gap: 10px;
    }

    .quick-link-btn {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-call {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--primary, #10b981);
      color: var(--primary, #10b981);
    }

    .btn-call:hover {
      background: var(--primary, #10b981);
      color: #fff;
    }

    .btn-map {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      color: #93c5fd;
    }

    .btn-map:hover {
      background: #3b82f6;
      color: #fff;
    }

    .items-summary-list {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 8px;
    }

    .payment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
    }

    .amount-text {
      color: var(--primary, #10b981);
      font-size: 16px;
    }

    .card-action-btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-take {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .btn-take:hover {
      background: #2563eb;
    }

    .btn-complete {
      background: var(--primary, #10b981);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-complete:hover {
      background: #059669;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.4);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 14px;
      color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <header class="courier-header">
    <div class="courier-brand">
      <div class="logo-icon"><i class="fa-solid fa-motorcycle"></i></div>
      <div>
        <h1>Zomin FastFood</h1>
        <span><span class="dot"></span> Kuryer Portali (Yetkazuvchi)</span>
      </div>
    </div>

    <div class="courier-controls">
      <button class="btn-sound" id="soundBtn"><i class="fa-solid fa-volume-high"></i> Ovoz: Yoqilgan</button>
      <button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</button>
    </div>
  </header>

  <main class="courier-container">
    <div class="status-filter-tabs">
      <button class="tab-pill active" data-filter="all">
        Barchasi <span class="tab-count" id="countAll">0</span>
      </button>
      <button class="tab-pill" data-filter="ready">
        🔔 Tayyor (Olib ketish) <span class="tab-count" id="countReady">0</span>
      </button>
      <button class="tab-pill" data-filter="delivering">
        🛵 Yo'lda (Menda) <span class="tab-count" id="countDelivering">0</span>
      </button>
    </div>

    <div class="courier-orders-grid" id="ordersGrid">
      <!-- Dynamic Delivery Orders populated via JS -->
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    let activeFilter = 'all';
    let allDeliveryOrders = [];
    let audioContext = null;

    // Check Role Access: courier or admin
    Auth.requireRole(['courier', 'admin']);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Tizimdan chiqmoqchimisiz?')) Auth.clearAuth();
    });

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      soundBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Ovoz: Yoqilgan';
    });

    function playBell() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(650, audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1100, audioContext.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
        osc.start();
        osc.stop(audioContext.currentTime + 0.4);
      } catch (_) {}
    }

    // Tabs filter click
    document.querySelectorAll('.tab-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderOrders();
      });
    });

    async function fetchOrders() {
      try {
        const res = await Auth.fetch('/api/orders');
        const data = await res.json();

        // Couriers handle delivery orders that are ready or delivering
        const deliveryOrders = data.filter(o => 
          o.orderType === 'delivery' && (o.status === 'ready' || o.status === 'delivering')
        );

        if (deliveryOrders.length > allDeliveryOrders.length) {
          playBell();
        }

        allDeliveryOrders = deliveryOrders;
        updateCounts();
        renderOrders();
      } catch (err) {
        console.error('Fetch orders error:', err);
      }
    }

    function updateCounts() {
      document.getElementById('countAll').textContent = allDeliveryOrders.length;
      document.getElementById('countReady').textContent = allDeliveryOrders.filter(o => o.status === 'ready').length;
      document.getElementById('countDelivering').textContent = allDeliveryOrders.filter(o => o.status === 'delivering').length;
    }

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      let filtered = allDeliveryOrders;

      if (activeFilter !== 'all') {
        filtered = allDeliveryOrders.filter(o => o.status === activeFilter);
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <i class="fa-solid fa-box-open"></i>
            <h3>Hozircha yetkazish buyurtmalari yo'q</h3>
            <p>Oshxona yangi taomni tayyorlashi bilan bu yerda ko'rinadi.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(order => {
        const itemsList = (order.items || []).map(i => `${i.name} × ${i.quantity}`).join(', ');
        const isReady = order.status === 'ready';

        return `
          <div class="delivery-card ${order.status}">
            <div class="card-top">
              <span class="order-id-badge">#${order.id}</span>
              <span class="status-badge ${order.status}">
                ${isReady ? '🔔 Oshxonada Tayyor' : '🛵 Sizning qo\'lingizda (Yo\'lda)'}
              </span>
            </div>

            <div class="customer-info-box">
              <div class="info-row">
                <i class="fa-solid fa-user"></i>
                <strong>${order.customerName || 'Mijoz'}</strong>
              </div>
              <div class="info-row">
                <i class="fa-solid fa-location-dot"></i>
                <span>${order.address || 'Zomin tumani'}</span>
              </div>
              ${order.note ? `
                <div class="info-row" style="color: #fbbf24;">
                  <i class="fa-solid fa-comment-dots"></i>
                  <span>${order.note}</span>
                </div>
              ` : ''}
            </div>

            <div class="action-links-row">
              <a href="tel:${order.phone}" class="quick-link-btn btn-call">
                <i class="fa-solid fa-phone"></i> ${order.phone || 'Qo\'ng\'iroq'}
              </a>
              <a href="https://yandex.ru/maps/?text=${encodeURIComponent(order.address || 'Zomin')}" target="_blank" class="quick-link-btn btn-map">
                <i class="fa-solid fa-location-arrow"></i> Xaritada ochish
              </a>
            </div>

            <div class="items-summary-list">
              <strong>Tarkibi:</strong> ${itemsList || 'Taomlar'}
            </div>

            <div class="payment-row">
              <span>To'lov (${(order.paymentMethod || 'Naqd').toUpperCase()}):</span>
              <span class="amount-text">${(order.totalAmount || 0).toLocaleString('uz-UZ')} UZS</span>
            </div>

            ${isReady ? `
              <button class="card-action-btn btn-take" onclick="updateStatus('${order.id}', 'delivering')">
                <i class="fa-solid fa-motorcycle"></i> Yetkazishga oldim
              </button>
            ` : `
              <button class="card-action-btn btn-complete" onclick="updateStatus('${order.id}', 'completed')">
                <i class="fa-solid fa-house-circle-check"></i> Mijozga topshirdim
              </button>
            `}
          </div>
        `;
      }).join('');
    }

    async function updateStatus(orderId, newStatus) {
      try {
        const res = await Auth.fetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });

        const data = await res.json();
        if (data.success) {
          await fetchOrders();
        } else {
          alert(data.error || 'Xatolik yuz berdi');
        }
      } catch (err) {
        console.error('Update status error:', err);
      }
    }

    // Auto-refresh every 4 seconds
    fetchOrders();
    setInterval(fetchOrders, 4000);
  </script>
</body>
</html>
